<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transforms In CSS</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .container{
            display: flex;
            gap:40px;
            border: 2px solid black;
            height: 40vh;
            width: 80vw; 
            margin: 20px;
        }
        .box{
            /* transform: rotate(45deg); */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: blueviolet;
            color: white;
            height: 66px;
            width: 66px;
            text-align: center;

        }
        .box2{
            transform: rotate(0.25turn);
        }
        .box3{
            transform: scaleX(1.5);
            transform: scaleY(2);

            /* or use scaleX or scaleY  */
        }
        .box4{
            /* this is equivalent to skewX because skew takes x,y as attributes */
            /* transform: skew(5deg); */

            /* for both x and y  or simply use skewX and skewY individually*/ 
            transform: skew(5deg,5deg) translate(100%,100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box</div>
        <div class=" box box2">Box2</div>
        <div class=" box box3">Box3</div>
        <div class="box box4">Box4</div>

    </div>
</body>
</html>
