<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Animation</title>
    <style>
        .container{
            display: flex;
            flex-direction: column-reverse;
            background-color: purple;
            height: 90vh;
            width: 90vw;
            position: relative;
        }
        .box{
            background-color: aquamarine;
            height: 60px;
            width: 60px;
            position: absolute;
            border-radius: 130px;
            animation: animateX 10s linear 2s infinite,
            animateY 2s ease-out 2s infinite alternate;
        }

        @keyframes animateX{
            from{
                left: 0;
            }
            to{
                left: 100%;
            }
        }

        @keyframes animateY{
            from{
                bottom: 0;
            }
            to{
                bottom:70%;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
