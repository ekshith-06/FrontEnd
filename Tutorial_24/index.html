<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and Outlines</title>
    <style>
         /* These box and text shadows is just simply like real world shadows that appear when they are exposed to light and they appear the same way */
        .box{
            padding: 34px;
            border:2px solid black;
             /* x cordinate , y cordinate , blure radius , spread radius and color of shadow */
            box-shadow: 2px 2px 5px red;
        }
        .text{
            text-shadow: 2px 2px 5px pink;
        }
    </style>
</head>
<body>
    <div class="box">I am a box</div>
    <p class="text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Illum corporis id minima sequi recusandae pariatur aut. Voluptas culpa vero consectetur atque modi sequi suscipit facilis voluptatum numquam iure quis voluptates, adipisci consequatur delectus, inventore unde!</p>

</body>
</html>
