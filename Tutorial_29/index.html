<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Felipa&family=Quicksand:wght@300..700&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
        rel="stylesheet">


    <title>Sample Card</title>
    <style>
        body {
            background-color: grey;
        }

        .card {
            width: 198px;
            height: 380px;
            background-color: white;
            border-radius: 7px;
        }

        .image {
            padding: 5px;
        }

        .image img {
            border-radius: 7px;
        }

        .content {
            padding: 7px 13px;
        }

        .content p {
            font-size: 12px;
            color: grey;
            font-family: "Spectral", serif;
        }

        .content h2{
            font-family: "Quicksand", sans-serif;
        }

        .capsules {
            padding: 0 9px;
        }

        .capsules span {
            border: 1px solid grey;
            border-radius: 7px;
            padding: 0 6px 0 6px;
            color: grey;
            font-size: 13px;
        }

        
    </style>
</head>

<body>
    <div class="card">
        <div class="image">
            <img width="188"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSCzMtQgBY6fng0NbOvf77W24Y1jIZFed0Bww&s"
                alt="Illustration of nature">
        </div>

        <div class="capsules">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="content">
            <h2>Description</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Autem quas beatae deserunt, quis, aliquid
                assumenda reprehenderit, quod est dignissimos quo molestias sunt dolorum.</p>
        </div>
    </div>
</body>

</html>
