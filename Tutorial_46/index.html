<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations In CSS</title>
    <style>
        .container{
            width: 40vw;
            height: 80vh;
            background-color: pink;
        }
        .box{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 45px;
            background-color: aqua;

             /* animation-name: animation1;
             animation-duration: 2s;
             animation-timing-function: cubic-bezier(0.0, 0, 0.0, 0.96);
              animation-iteration-count:infinite;
              animation-delay: 2s;
              animation-direction: reverse; */

              /*  Insted of above , use this shorthand */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */


             /* can combine 2 animations using ,  */
            animation: animation1 2s ease-in-out 2s infinite,
                        animation2 2s ease-in-out 2s infinite;
        }

        @keyframes animation1{
            from{
                background-color: red;
            }
            to{
                background-color: purple;
                translate:35vw;
            }
        }        @keyframes animation2 {

            25%{
                 rotate: 0.25turn;
            }
            50%{
                 rotate: 0.5turn;
            }
            75%{
                 rotate: 0.75turn;
            }
            100%{
                 rotate: 1turn;
            }

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box</div>
    </div>
</body>
</html>
