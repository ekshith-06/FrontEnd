<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid In CSS</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        .container {
            height: 100vh;
            border: 2px solid black;
            /* background-color: aqua; */
            display: grid;
            /* grid-template-columns: repeat(3,1fr); */
            grid-template-areas: "header header header header"
                "body body side ads "
                "footer footer footer footer";
            gap:10px 25px;
            text-align: center;
        }

        .items {
            display: flex;
            color: white;
            border: 2px solid rgb(39, 199, 235);
            height: 150px;
            font-weight: bold;
            text-align: center;
            justify-content: center;
            align-items: center;
        }

        .header {
            grid-area:header;
            background-color: pink; 
        }

        .body{
            grid-area:body;
            background-color: burlywood;
        }

        .side-area{
            background-color: brown;
            grid-area:side;
        }

        .ads{
            background-color: purple;
            grid-area:ads;
        }

        .footer{
            grid-area:footer;
            background-color: orange;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items header"> Header Area</div>
        <div class="items body"> Body</div>
        <div class="items side-area"> Side Text</div>
        <div class="items ads"> Ads</div>
        <div class="items footer">Footer Area</div>
    </div>

</body>

</html>
