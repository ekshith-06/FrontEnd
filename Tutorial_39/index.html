<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid In CSS</title>
    <style>
        .container{
            border: 2px solid black;
            display: grid;
            grid-template-columns: 100px 100px;
            grid-template-rows: 100px 100px 100px ;
        }

        .items{
            margin:2px;
            border: 2px solid red;
            height: 50px;
            /* width: 50px; */
        }
        
        .item-4{
            /* This is grid-row start to end  */
            grid-row: 1/2;

            /* or can use this  */
            grid-row-start: 1;
            grid-row-end: 2; 
            /* same as the above  */

        }

        .item-5{
            grid-column:2/3;
            grid-row:2/3;
        }

        .item-3{

            grid-column: 1/3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items item-1">1</div>
        <div class="items item-2">2</div>
        <div class="items item-3">3</div>
        <div class="items item-4">4</div>
        <div class="items item-5">5</div>
    </div>
</body>
</html>
