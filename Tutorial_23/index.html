<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid black;
            background-color: aquamarine;
            display: inline-block;
            padding: 40px;
            margin: 34px;
            text-align: center;
        }

        .box2 {
            border: 2px solid black;
            display: inline-block;
            background-color: red;
            color: black;
            padding: 45px;
            margin: 34px;
            text-align: center;
            /* Display none means that the element will not be displayed on the page at all. It will not take up any space in the layout, and it will not be visible to the user. This is different from visibility: hidden, which hides the element but still takes up space in the layout. With display: none, the element is completely removed from the document flow, and it will not affect the layout of other elements on the page. */
            /* display: none; */
            visibility: hidden;
        }
    </style>
</head>

<body>
    <div class="box">Iam A Box</div>
    <div class="box">Also a nice box</div>
    <div class="box2">This is Box 2</div>
    <span> Iam A Good</span>
    <span>Boy</span>
</body>

</html>
