<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>

        /* Refer The MDN Documentation --&gt; CSS Box Model */
        /* Read About margin collapse and box-sizing property and all those things in the documentation to understand the box model better. */
        .Box{
            background-color: aqua;
        }
        .Box1{
            color:pink;
            padding:20px;
            margin: 10px;
            border : 2px solid blue;
            height: 350px;
            box-sizing: border-box;

        }
        .Box2{
            background-color: black;
            color:pink;
            padding:20px;
            margin: 10px;
            border : 2px solid blue;
            height: 350px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
        <div class="Box Box1">This is a Box</div>
        <div class="Box Box2">This is another Box</div>
        
</body>
</html>
