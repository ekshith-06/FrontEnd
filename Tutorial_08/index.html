<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inline and Block Elements</title>
</head>

<body>
    <p>This is a Paragraph and Its an block element</p>
    <a href="https://www.youtube.com" target="_blank"> This is a link element and its an inline element</a>
    <span>This is span element And its an inline element</span>
    <h1>Without using br tag, write a vertically alligned form asking for name , city </h1>
    <form action="#">
        <p>
            <label for="name">Name: </label>
            <input type="text" id="name" placeholder="Enter Your Name">
        </p>
        <div>
                <label for="city">City: </label>
                <input type="text" id="city" placeholder="Enter Your City">
        </div>
        <div>
            <label for="pincode">Pincode: </label>
            <input type="text" id="pincode" placeholder="Enter Your Pincode">
        </div>
    </form>
</body>

</html>
