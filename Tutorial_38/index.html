<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox In CSS</title>
    <style>
        .container{

            /* Flex Properties belonging to container i.e to be applied on the container  */
            border: 2px solid red;
            display: flex;
            height: 80vh;
            /* justify-content: center; */
            /* align-items: center;  */

            /* To align multiple lines use align content center  */
            align-content: center;
            gap: 30px;
            row-gap: 20px;
            column-gap: 5px;
            /* gap:row-gap col gap */
            flex-wrap: wrap;
            /* flex-direction: column; */
        }
        .item{
            height: 34px;
            width: 36px;
            border: 2px solid black;
            background-color: blueviolet;
            /* margin:3px; */
        }
        .order-100{
            /* This flex property belonging to element not the container  */
            /* the more the order the later the element goes i.e elements are in ascending order of order */
            /* Default order is 0 for all  */
            order:100;
        }

        .order-2{
            order:2;
        }

    </style>
</head>
<body>
    <main>
        <div class="container">
            <div style="color:white" class="item order-100">Order-100</div>
            <div style="color: white;" class="item order-2">Order-2</div>
            <div class="item item-grow"></div>
